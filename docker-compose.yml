# CMS stack (API + web) — connects to your EXISTING MySQL, does not create one.
#   docker compose up -d --build
# Ports (host): web 3021, api 3022.
#
# The API reaches your existing MySQL container over the network that DB stack already uses
# (db-network at the bottom of this file — joined, never created). In the root .env set
# DB_NETWORK to that network's real docker name and MYSQL_HOST to the DB container's name;
# see .env.example.
#
# Going through the host's published 3306 (host.docker.internal) also works, but on Linux
# container→host traffic hits the host INPUT chain, so ufw silently drops it (ETIMEDOUT).
name: cms

services:
  api:
    build: ./cms-api
    container_name: cms-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"   # fallback route to the host's published 3306
    environment:
      PORT: 3022
      # name of the MySQL CONTAINER (resolved by docker DNS on db-network), e.g. bs_database.
      # host.docker.internal only as a fallback — see the note at the top of this file.
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cms}
      JWT_SECRET: ${JWT_SECRET:-dev-compose-jwt-secret-change-me-please}
      JWT_EXPIRES: 12h
      # public origin of the web app (for CORS). In prod set PUBLIC_WEB_URL in .env.
      CORS_ORIGIN: ${PUBLIC_WEB_URL:-http://localhost:3021}
      UPLOAD_DIR: /app/uploads
      # AUTO_SEED stays OFF by default so an existing DB is never reset. Only set it
      # to "true" against a brand-new/empty database you want auto-seeded.
      AUTO_SEED: ${AUTO_SEED:-false}
    ports:
      - "${API_PORT:-3022}:3022"
    volumes:
      - api_uploads:/app/uploads
    networks:
      - cms-network   # api ↔ web
      - db-network    # api ↔ MySQL container

  web:
    build:
      context: ./cms-web
      args:
        # baked into the client bundle at BUILD time → must be reachable from the BROWSER.
        # In prod set PUBLIC_API_URL in .env, then rebuild: docker compose build web
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3022/api}
        # sub-path the site is served from (no sub-domain available). Also baked in at
        # BUILD time — changing WEB_BASE_PATH requires: docker compose build web
        NEXT_PUBLIC_BASE_PATH: ${WEB_BASE_PATH-/cms}
    container_name: cms-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: 3021
      # server-side calls (NextAuth) reach the api container by service name (internal — never change)
      API_URL: http://api:3022/api
      # must match the build arg above — `next start` reads it to route the sub-path
      NEXT_PUBLIC_BASE_PATH: ${WEB_BASE_PATH-/cms}
      # public URL of the site. With a basePath, NextAuth needs the FULL path to its route
      # handler (<origin><basePath>/api/auth), not just the origin.
      NEXTAUTH_URL: ${PUBLIC_WEB_URL:-http://localhost:3021}${WEB_BASE_PATH-/cms}/api/auth
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-compose-nextauth-secret-change-me}
    ports:
      - "${WEB_PORT:-3021}:3021"
    networks:
      - cms-network

volumes:
  api_uploads:
networks:
  cms-network:
    driver: bridge
  # The MySQL stack's own network — compose only JOINS it, never creates or removes it,
  # so `docker compose down` here cannot disturb the database stack.
  # DB_NETWORK is the name docker actually gave it, which for a non-external network in
  # another compose file is <project>_<name> (e.g. theerasan-network → xxx_theerasan-network):
  #   docker inspect -f '{{range $$k,$$v := .NetworkSettings.Networks}}{{$$k}}{{end}}' bs_database
  db-network:
    external: true
    name: ${DB_NETWORK:-cms-db}